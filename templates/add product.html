<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Smart Inventory</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #172033;
            padding: 25px 15px;
            color: white;
        }

        .logo {
            text-align: center;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .menu a {
            display: block;
            padding: 14px 16px;
            margin: 7px 0;
            color: #ddd;
            text-decoration: none;
            border-radius: 9px;
        }

        .menu a:hover,
        .menu .active {
            background: #2563eb;
            color: white;
        }

        .main {
            margin-left: 240px;
            padding: 35px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .box {
            max-width: 700px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        @media(max-width:600px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">

        <div class="logo">
            📦 Smart Inventory
        </div>

        <div class="menu">

            <a href="/">
                🏠 Dashboard
            </a>

            <a href="/inventory">
                📋 Inventory
            </a>

            <a href="/products" class="active">
                ➕ Add Product
            </a>

            <a href="/sales">
                💰 Sales
            </a>

            <a href="/logout">
                🚪 Logout
            </a>

        </div>

    </div>


    <div class="main">

        <h1>➕ Add New Product</h1>

        <div class="box">

            <form action="/products" method="POST">

                <div class="form-group">

                    <label>Product Name</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Example: Kanchipuram Saree"
                        required>

                </div>


                <div class="form-group">

                    <label>Category</label>

                    <select name="category" required>

                        <option value="">Select Category</option>
                        <option value="Saree">Saree</option>
                        <option value="Shirt">Shirt</option>
                        <option value="Pant">Pant</option>
                        <option value="Dress">Dress</option>
                        <option value="Other">Other</option>

                    </select>

                </div>


                <div class="form-group">

                    <label>Quantity</label>

                    <input
                        type="number"
                        name="quantity"
                        min="0"
                        placeholder="Enter quantity"
                        required>

                </div>


                <div class="form-group">

                    <label>Price (₹)</label>

                    <input
                        type="number"
                        name="price"
                        min="0"
                        step="0.01"
                        placeholder="Enter price"
                        required>

                </div>


                <button type="submit">
                    💾 Save Product
                </button>

            </form>

        </div>

    </div>

</body>
</html>
