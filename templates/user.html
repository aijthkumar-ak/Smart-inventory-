<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Profile - Smart Inventory</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1f2937;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: #111827;
            padding: 25px 15px;
            color: white;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
        }

        .logo span {
            color: #60a5fa;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin: 8px 0;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: #cbd5e1;
            padding: 14px 16px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .menu a:hover,
        .menu a.active {
            background: #2563eb;
            color: white;
        }

        .logout {
            position: absolute;
            bottom: 25px;
            left: 15px;
            right: 15px;
        }

        .logout a {
            display: block;
            text-decoration: none;
            background: #dc2626;
            color: white;
            padding: 13px;
            text-align: center;
            border-radius: 10px;
        }

        /* MAIN */
        .main {
            margin-left: 240px;
            padding: 35px;
        }

        .topbar {
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 30px;
            margin-bottom: 7px;
        }

        .topbar p {
            color: #6b7280;
        }

        /* PROFILE */
        .profile-card {
            max-width: 650px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
        }

        .profile-header h2 {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .profile-header p {
            color: #64748b;
        }

        .info {
            margin-top: 20px;
        }

        .info-box {
            background: #f8fafc;
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .info-box label {
            display: block;
            color: #64748b;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .info-box strong {
            font-size: 16px;
        }

        /* MOBILE */
        @media (max-width: 768px) {

            .sidebar {
                width: 70px;
                padding: 20px 8px;
            }

            .logo {
                font-size: 0;
            }

            .logo::before {
                content: "📦";
                font-size: 25px;
            }

            .menu a {
                text-align: center;
                font-size: 0;
                padding: 15px 5px;
            }

            .menu a::first-letter {
                font-size: 20px;
            }

            .logout {
                left: 8px;
                right: 8px;
            }

            .logout a {
                font-size: 0;
            }

            .logout a::before {
                content: "🚪";
                font-size: 20px;
            }

            .main {
                margin-left: 70px;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="logo">
            📦 <span>Inventory</span>
        </div>

        <ul class="menu">

            <li>
                <a href="/">
                    🏠 Dashboard
                </a>
            </li>

            <li>
                <a href="/inventory">
                    📦 Inventory
                </a>
            </li>

            <li>
                <a href="/products">
                    ➕ Add Product
                </a>
            </li>

            <li>
                <a href="/sales">
                    💰 Sales
                </a>
            </li>

            <li>
                <a href="/user" class="active">
                    👤 User
                </a>
            </li>

            <li>
                <a href="/settings">
                    ⚙️ Settings
                </a>
            </li>

        </ul>

        <div class="logout">
            <a href="/logout">
                🚪 Logout
            </a>
        </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

        <div class="topbar">
            <h1>User Profile</h1>
            <p>View your account information</p>
        </div>


        <div class="profile-card">

            <div class="profile-header">

                <div class="avatar">
                    {{ username[0]|upper }}
                </div>

                <div>
                    <h2>{{ username }}</h2>
                    <p>Inventory User</p>
                </div>

            </div>


            <div class="info">

                <div class="info-box">
                    <label>Username</label>
                    <strong>{{ username }}</strong>
                </div>

                <div class="info-box">
                    <label>Account Status</label>
                    <strong>Active</strong>
                </div>

                <div class="info-box">
                    <label>Role</label>
                    <strong>Inventory User</strong>
                </div>

            </div>

        </div>

    </main>

</body>
</html>
